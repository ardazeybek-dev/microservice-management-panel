<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>👑 Supervisor Management Panel</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e272e; color: #d2dae2; text-align: center; padding: 40px; }
        h1 { color: #0fbcf9; margin-bottom: 5px;}
        .subtitle { color: #808e9b; font-size: 14px; margin-bottom: 30px;}
        .panel { background-color: #485460; padding: 30px; border-radius: 15px; box-shadow: 0px 10px 20px rgba(0,0,0,0.3); max-width: 800px; margin: 0 auto; }
        button { padding: 15px 30px; font-size: 16px; font-weight: bold; cursor: pointer; border: none; border-radius: 8px; margin: 10px; transition: 0.3s; }
        .btn-send { background-color: #05c46b; color: white; }
        .btn-refresh { background-color: #ffa801; color: white; }
        .btn-ai { background-color: #9b59b6; color: white; }
        button:hover { transform: scale(1.05); }
        input[type="file"] { margin: 15px; padding: 10px; background-color: #1e272e; border-radius: 5px; color: white;}

        #list-area { margin-top: 30px; text-align: left; background-color: #1e272e; padding: 20px; border-radius: 10px; height: 400px; overflow-y: auto; color: #0be881; font-family: monospace; font-size: 15px; white-space: pre-wrap; }
    </style>
</head>
<body>

    <div class="panel">
        <h1>👑 Supervisor Control Center</h1>
        <div class="subtitle">PostgreSQL (JSON) • RabbitMQ (RPC) • AI Integration</div>

        <button class="btn-send" onclick="sendTask()">🐇 Send Task to Student Group</button>
        <button class="btn-refresh" onclick="refreshData()">🔄 Refresh Database</button>

        <hr style="border-color: #808e9b; margin: 25px 0;">

        <h2 style="color: #9b59b6;">🤖 AI File Analysis</h2>
        <input type="file" id="fileSelect" accept=".txt">
        <br>
        <button class="btn-ai" onclick="analyzeFile()">Upload and Analyze File 🪄</button>

        <div id="list-area">
            <pre id="data-screen">System ready, awaiting command...</pre>
        </div>
    </div>

    <script>
        const API_URL = "http://localhost:3006";

        async function sendTask() {
            document.getElementById('data-screen').innerText = "Sending task to the queue... 🐇📬";
            try {
                const response = await fetch(`${API_URL}/rpc-test`);
                const data = await response.json();
                document.getElementById('data-screen').innerText = "TASK SUCCESSFUL! RPC response:\n\n" + JSON.stringify(data, null, 4);

                setTimeout(refreshData, 2000);
            } catch (error) { document.getElementById('data-screen').innerText = "Backend connection error!"; }
        }

        async function refreshData() {
            try {
                const response = await fetch(`${API_URL}/records`);
                const data = await response.json();
                document.getElementById('data-screen').innerText = "CURRENT DATABASE RECORDS:\n\n" + JSON.stringify(data, null, 4);
            } catch (error) { document.getElementById('data-screen').innerText = "Could not fetch data!"; }
        }

        async function analyzeFile() {
            const fileInput = document.getElementById('fileSelect');
            if (fileInput.files.length === 0) {
                alert("Please select a .txt file first!");
                return;
            }

            const formData = new FormData();
            formData.append("document", fileInput.files[0]);

            document.getElementById('data-screen').innerText = "AI is reading the file, please wait... ⏳";

            try {
                const response = await fetch(`${API_URL}/ai-analyze`, {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                document.getElementById('data-screen').innerText = "AI RESULT:\n\n" + JSON.stringify(data, null, 4);
            } catch (error) {
                document.getElementById('data-screen').innerText = "Could not reach the AI server!";
            }
        }

        window.onload = refreshData;
    </script>
</body>
</html>
